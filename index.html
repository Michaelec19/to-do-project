<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainer Schedule - Lan Hua</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body id="lanhua-trainer-view">

  <nav id="lanhua-navbar" class="navbar navbar-dark bg-dark mb-2 p-3">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <h1 class="navbar-brand h5 m-0 d-flex align-items-center gap-2 fw-bold">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle border border-warning bg-white overflow-hidden" style="width: 50px; height: 50px;">
          <img src="./img/Logo.jpeg" alt="Logo LanHua" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
         Club Deportivo LanHua
      </h1>
      <div class="d-flex align-items-center gap-3 text-white">
        <span class="fs-6">Vista: Entrenador (Wushu/Kung fu)</span>
      </div>
    </div>
  </nav>

  <main id="lanhua-main-container" class="container">

    <div class="row g-4 mt-1">
      
      <aside class="col-md-4">
        <div id="lanhua-form-card" class="card shadow-sm border-0">
          <div class="card-body">
            <h2 class="h5 fw-bold mb-3">Programar Sesiónes</h2>

            <div id="lanhua-form-alert" class="alert alert-danger d-none py-2 fs-6" role="alert">
              <i class="fa-solid fa-triangle-exclamation me-1"></i> <span id="lanhua-alert-text">Por favor completa todos los campos requeridos.</span>
            </div>
            
            <form id="lanhua-schedule-form">
              <div class="mb-2">
                <label for="lanhua-discipline-select" class="form-label fw-semibold">Tipo de Práctica</label>
                <select id="lanhua-discipline-select" class="form-select">
                  <option selected disabled value="">Seleccionar disciplina...</option>
                  <option value="wushu">Wushu</option>
                  <option value="sanda">Sanda</option>
                  <option value="taolu">Taolu</option>
                  <option value="taolu">Tai Chi</option>
                </select>
              </div>

              <div class="mb-2">
                <label for="lanhua-level-select" class="form-label fw-semibold">Nivel</label>
                <select id="lanhua-level-select" class="form-select">
                  <option selected disabled value="">Seleccionar nivel...</option>
                  <option value="beginner">Principiante</option>
                  <option value="intermediate">Intermedio</option>
                  <option value="advanced">Avanzado</option>
                </select>
              </div>

              <div class="mb-2">
                <label for="lanhua-location-select" class="form-label fw-semibold">Sede / Ubicación</label>
                <select id="lanhua-location-select" class="form-select">
                  <option selected disabled value="">Seleccionar sede...</option>
                  <option value="laureles">Sede Principal - Laureles</option>
                  <option value="harunohinata">Sede Haru No Hinata</option>
                  <option value="poblado">Sede Monterrey Hayeshi</option>
                </select>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-6">
                  <label for="lanhua-date-input" class="form-label fw-semibold">Fecha</label>
                  <input type="date" id="lanhua-date-input" class="form-control">
                </div>
                <div class="col-6">
                  <label for="lanhua-time-input" class="form-label fw-semibold">Hora</label>
                  <input type="time" id="lanhua-time-input" class="form-control">
                </div>
              </div>

              <div class="mb-2">
                <label for="lanhua-notes-input" class="form-label fw-semibold">Observaciones</label>
                <textarea id="lanhua-notes-input" class="form-control" rows="3" placeholder="Agrega notas u observaciones de la clase..."></textarea>
              </div>

              <div class="form-check form-switch mb-3 d-flex align-items-center gap-2">
                <div class="form-check-label fw-semibold text-warning" for="lanhua-type-toggle">
                  <i class="fa-solid fa-user"></i> Personalizada
                </div>
                <input class="form-check-input mt-0 m-0" type="checkbox" role="switch" id="lanhua-type-toggle">
                <label class="form-check-label fw-semibold text-warning" for="lanhua-type-toggle">
                  <i class="fa-solid fa-users"></i> Grupal
                </label>
              </div>

              <button type="submit" id="lanhua-submit-btn" class="btn w-100 fw-bold">
                <i class="fa-solid fa-calendar-plus"></i> Agendar Sesión
              </button>
            </form>
          </div>
        </div>
      </aside>

      <section class="col-md-8">
        <header class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 fw-bold m-0">Mi Agenda de Hoy</h2>
          <span id="lanhua-class-count" class="badge bg-dark rounded-pill">0 clases programadas</span>
        </header>

        <div id="lanhua-class-list" class="d-flex flex-column gap-3">
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
