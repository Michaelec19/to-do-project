<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainer Schedule - Lan Hua</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body id="lanhua-trainer-view" class="d-flex flex-column min-vh-100">

<nav id="lanhua-navbar" class="navbar navbar-dark bg-dark mb-4 p-3 shadow-sm border-bottom border-secondary">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <h1 class="navbar-brand h5 m-0 d-flex align-items-center gap-2 fw-bold">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle border border-warning bg-white overflow-hidden" style="width: 40px; height: 40px;">
        <img src="./img/Logo.jpeg" alt="Logo LanHua" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      LAN HUA AGENDA
    </h1>
    <div class="d-flex align-items-center gap-3 text-white">
      <span class="fs-6 text-warning">Mi Agenda Entrenador</span>
    </div>
  </div>
</nav>

<main id="lanhua-main-container" class="container flex-grow-1">
  <div class="row g-4">
    <aside class="col-12 col-lg-4 order-2 order-lg-1">
      <div id="lanhua-form-card" class="card shadow-sm bg-card-custom rounded-3">
        <div class="card-body p-4">
          <h2 class="h5 fw-bold mb-3 text-warning">Programar Sesión</h2>

          <div id="lanhua-form-alert" class="alert alert-danger d-none py-2 fs-6 border-0" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> <span id="lanhua-alert-text">Revisa los campos requeridos.</span>
          </div>

          <form id="lanhua-schedule-form">
            <div class="mb-3">
              <label for="lanhua-discipline-select" class="form-label fw-semibold small">Tipo de Práctica</label>
              <select id="lanhua-discipline-select" class="form-select form-select-sm">
                <option selected disabled value="">Seleccionar disciplina...</option>
                <option value="wushu">Wushu General</option>
                <option value="sanda">Sanda</option>
                <option value="taolu">Taolu</option>
                <option value="taichi">Tai Chi</option>
                <option value="Acondicionamiento">Acondicionamiento</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="lanhua-level-select" class="form-label fw-semibold small">Nivel</label>
              <select id="lanhua-level-select" class="form-select form-select-sm">
                <option selected disabled value="">Seleccionar nivel...</option>
                <option value="beginner">Principiante</option>
                <option value="intermediate">Intermedio</option>
                <option value="advanced">Avanzado</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="lanhua-location-select" class="form-label fw-semibold small">Sede / Ubicación</label>
              <select id="lanhua-location-select" class="form-select form-select-sm">
                <option selected disabled value="">Seleccionar sede...</option>
                <option value="laureles">Sede Principal - Laureles</option>
                <option value="harunohinata">Sede Haru No Hinata</option>
                <option value="poblado">Sede Monterrey Hayeshi</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="lanhua-date-input" class="form-label fw-semibold small">Fecha</label>
              <input type="date" id="lanhua-date-input" class="form-control form-control-sm">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="lanhua-start-time" class="form-label fw-semibold small">Hora Inicio</label>
                <input type="time" id="lanhua-start-time" class="form-control form-control-sm">
              </div>
              <div class="col-6">
                <label for="lanhua-end-time" class="form-label fw-semibold small">Hora Fin</label>
                <input type="time" id="lanhua-end-time" class="form-control form-control-sm">
              </div>
            </div>

            <div class="mb-3">
              <label for="lanhua-notes-input" class="form-label fw-semibold small">Observaciones</label>
              <textarea id="lanhua-notes-input" class="form-control form-control-sm" rows="2" placeholder="Notas de la clase..."></textarea>
            </div>

            <div class="form-check form-switch mb-4 d-flex align-items-center gap-2">
              <div class="form-check-label fw-semibold small text-light" for="lanhua-type-toggle">
                <i class="fa-solid fa-user text-warning"></i> Personalizada
              </div>
              <input class="form-check-input mt-0 m-0" type="checkbox" role="switch" id="lanhua-type-toggle">
              <label class="form-check-label fw-semibold small text-light" for="lanhua-type-toggle">
                <i class="fa-solid fa-users text-warning"></i> Grupal
              </label>
            </div>

            <button type="submit" id="lanhua-submit-btn" class="btn btn-warning w-100 fw-bold">
              <i class="fa-solid fa-calendar-plus"></i> Agendar Sesión
            </button>
          </form>
        </div>
      </div>
    </aside>

    <section class="col-12 col-lg-8 order-1 order-lg-2">
      <header class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
        <h2 class="h4 fw-bold m-0 text-warning">Agenda de Entrenamiento</h2>
        <span id="lanhua-class-count" class="badge bg-warning text-dark rounded-pill">0 clases programadas</span>
      </header>

      <div id="lanhua-class-list" class="d-flex flex-column gap-3 overflow-auto" style="max-height: 80vh; padding-bottom: 2rem;">
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/taskManager.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
