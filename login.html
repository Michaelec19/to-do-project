<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LAN HUA | Autenticación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="d-flex flex-column min-vh-100 mobile-wrapper justify-content-center align-items-center p-3">
<div class="position-absolute top-0 end-0 p-3">
    <button class="btn btn-sm btn-outline-light rounded-circle" id="btnLoginThemeToggle" title="Cambiar modo">
        <i class="fa-solid fa-circle-half-stroke"></i>
    </button>
</div>
<div class="text-center mb-4 w-100">
    <div class="d-inline-flex align-items-center gap-2">
        <img src="./img/Logo.jpeg" alt="LAN HUA Logo" class="rounded-circle border border-warning bg-white object-fit-contain" style="height: 60px; width: 60px;" />
        <span class="fw-bold fs-2 text-white title-app-login">LAN HUA AGENDA</span>
    </div>
</div>

<div class="card border-secondary shadow-lg w-100" style="background-color: rgba(26, 29, 32, 0.95); border-radius: 20px;">
    <div class="card-body p-4">
        <ul class="nav nav-pills nav-justified mb-4 auth-tabs border-bottom border-secondary border-opacity-25 pb-2" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold text-white bg-transparent border-0" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button" role="tab">Ingresar</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold text-muted bg-transparent border-0" id="register-tab" data-bs-toggle="pill" data-bs-target="#register" type="button" role="tab">Registro</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
            <div class="tab-pane fade show active" id="login" role="tabpanel">
                <div class="text-center mb-4">
                    <p class="small text-secondary mb-0">Ingresa tus datos para continuar</p>
                </div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small text-warning fw-semibold">Correo electrónico</label>
                        <input type="email" class="form-control" id="loginCorreo" placeholder="correo@lanhua.com" required />
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-warning fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="loginPassword" placeholder="********" required />
                            <button class="btn btn-outline-secondary border-secondary toggle-password" type="button" data-target="loginPassword">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm d-flex justify-content-center align-items-center gap-2">
                        <span>Iniciar Sesión</span>
                        <div class="spinner-border spinner-border-sm d-none" role="status" id="loginSpinner"></div>
                    </button>
                </form>
            </div>
            <div class="tab-pane fade" id="register" role="tabpanel">
                <div class="text-center mb-4">
                    <p class="small text-secondary mb-0">Ten tu agenda marcial en tu mano</p>
                </div>
                <form id="registerForm">
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small text-warning fw-semibold">Nombre</label>
                            <input type="text" class="form-control" id="regNombre" required />
                        </div>
                        <div class="col-6">
                            <label class="form-label small text-warning fw-semibold">Apellido</label>
                            <input type="text" class="form-control" id="regApellido" required />
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-warning fw-semibold">Correo</label>
                        <input type="email" class="form-control" id="regCorreo" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-warning fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="regPassword" required />
                            <button class="btn btn-outline-secondary border-secondary toggle-password" type="button" data-target="regPassword">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm d-flex justify-content-center align-items-center gap-2 mt-4">
                        <span>Crear Cuenta</span>
                        <div class="spinner-border spinner-border-sm d-none" role="status" id="registerSpinner"></div>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./js/auth.js"></script>
</body>
</html>
